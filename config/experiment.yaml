project:
  name: detectability-aware-rdh
  version: 0.2.0
  seed: 20260917
  baseline_version: 0.1.7

dataset:
  prepared_manifest: /workspace/data/processed/dataset_manifest.csv
  block_size: 64
  split_seed: 20260916
  expected_splits:
    train: 6000
    validation: 2000
    test: 2000

baseline:
  split: test
  stress_fraction_of_global_capacity: 0.50
  file_io_check: true
  resume: true

payload:
  candidate_net_bpp: [0.05, 0.10, 0.20, 0.30]
  minimum_validation_feasibility: 0.95
  fallback_levels: 4
  fallback_quantile: 0.05
  minimum_level_bpp: 0.001

risk_model:
  block_size: 64
  probe_fraction: 0.25
  probe_max_bits: 256
  max_training_blocks: 50000

allocator:
  strategies: [raster, random, predictability, detectability, joint]
  alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  tune_payload_index: 1
  validation_images: 2000
  auxiliary_train_images: 1500

frozen_test:
  images: 2000
  file_io_check_every: 100
  resume: true

detectors:
  fixed_fpr: 0.05
  rich_train_images: 6000
  cnn_train_images: 2000
  cnn_validation_images: 500
  cnn_epochs: 5
  cnn_batch_size: 16
  adaptive_primary_payload_only: true
  adaptive_train_images: 3000

statistics:
  bootstrap_resamples: 5000
  cluster_bootstrap_resamples: 2000
  confidence: 0.95

cross_source:
  enabled_by_default: false
  variants: [grayscale/QF75, grayscale/QF85, grayscale/QF95]
